<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050814" />
    <title>Sem conexão</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #050814;
        color: #f0f4ff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .caixa { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 0; color: rgba(240, 244, 255, 0.65); line-height: 1.5; }
      button {
        margin-top: 6px;
        padding: 12px 22px;
        border: 0;
        border-radius: 12px;
        background: #1856ff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="caixa">
      <img src="/icones/icone-192.png" alt="" />
      <h1>Sem conexão com o sistema</h1>
      <p>Confira se o celular está no mesmo Wi-Fi do computador da recepção e se o sistema está ligado.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
